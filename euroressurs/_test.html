<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>test</title>
<style>
  html,body{margin:0;background:#fff}
  iframe{display:block;width:1440px;height:2300px;border:0}
  #log{position:fixed;left:0;bottom:0;font:12px monospace;background:#ffe;padding:4px;z-index:9}
</style>
</head>
<body>
<iframe id="ramme" src="index.html"></iframe>
<p id="log"></p>
<script>
(function () {
  var modus = new URLSearchParams(location.search).get('mode') || 'tom';
  var ramme = document.getElementById('ramme');
  var log = document.getElementById('log');

  function feil(tekst) {
    log.textContent += ' FEIL: ' + tekst;
    console.error(tekst);
  }

  ramme.addEventListener('load', function () {
    var d = ramme.contentDocument;
    var w = ramme.contentWindow;
    w.addEventListener('error', function (e) { feil(e.message); });

    setTimeout(function () {
      if (modus === 'tom') return;

      var klikk = function (sel) {
        var el = d.querySelector(sel);
        if (!el) { feil('mangler ' + sel); return; }
        el.click();
      };
      var skriv = function (sel, verdi) {
        var el = d.querySelector(sel);
        if (!el) { feil('mangler ' + sel); return; }
        el.value = verdi;
        el.dispatchEvent(new w.Event('input', { bubbles: true }));
        el.dispatchEvent(new w.Event('change', { bubbles: true }));
      };

      if (modus === 'feil') {
        klikk('#behov-skjema button[type="submit"]');
      }

      if (modus === 'fylt' || modus === 'kvittering') {
        klikk('[data-fag="Isolasjon"]');
        klikk('[data-fag="Stillas"]');
        skriv('#rolle', 'Operatører og fagarbeidere');
        skriv('#antall', '6');
        skriv('#oppstart', '2026-11-02');
        klikk('[data-varighet="3–6 måneder"]');
        skriv('#sted', 'Stord');
        skriv('#navn', 'Kari Nordmann');
        skriv('#firma', 'Nordvest Prosjekt AS');
        skriv('#epost', 'kari@nordvest-prosjekt.no');
        skriv('#telefon', '+47 900 00 000');
        skriv('#merknad', 'Isolasjon på to moduler, oppstart i november.');
        if (modus === 'kvittering') {
          klikk('#behov-skjema button[type="submit"]');
        }
      }

      setTimeout(function () {
        var mal = d.getElementById('foresporsel');
        if (mal) w.scrollTo(0, mal.getBoundingClientRect().top + w.scrollY - 90);
        log.textContent = 'modus=' + modus + ' ferdig';
      }, 250);
    }, 600);
  });
})();
</script>
</body>
</html>
