<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Selvtest 2 — meny og tilbake</title>
<style>
  body { margin: 0; padding: 20px 24px; font: 15px/1.5 ui-monospace, Consolas, monospace; background: #101216; color: #e8eaee; }
  h1 { font: 600 20px/1.3 system-ui, sans-serif; margin: 0 0 10px; }
  li { margin: 3px 0; }
  .ok { color: #57d38c; }
  .feil { color: #ff7b72; }
  #sum { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font: 600 16px/1.4 system-ui, sans-serif; }
  #sum.ok { background: #10301f; color: #7ee2a8; }
  #sum.feil { background: #331414; color: #ff9b93; }
  iframe { position: absolute; left: -10000px; width: 390px; height: 1200px; border: 0; }
</style>
</head>
<body>
<h1>Selvtest 2 — mobilmeny og «endre svarene»</h1>
<ol id="log"></ol>
<div id="sum">Kjører …</div>
<iframe id="ramme" src="index.html" title="zegabit"></iframe>
<script>
(function () {
  'use strict';
  var log = document.getElementById('log');
  var sum = document.getElementById('sum');
  var ramme = document.getElementById('ramme');
  var feil = 0, antall = 0;

  function skriv(ok, navn, detalj) {
    antall++;
    if (!ok) feil++;
    var li = document.createElement('li');
    li.className = ok ? 'ok' : 'feil';
    li.textContent = (ok ? 'PASS  ' : 'FAIL  ') + navn + (detalj ? '  — ' + detalj : '');
    log.appendChild(li);
  }
  function sov(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  ramme.addEventListener('load', function () {
    var d = ramme.contentDocument;
    var w = ramme.contentWindow;
    function q(s) { return d.querySelector(s); }
    function synlig(el) { return el && el.getBoundingClientRect().height > 0; }

    (async function () {
      try {
        await sov(400);
        var toggle = q('[data-nav-toggle]');
        var nav = q('[data-nav]');
        skriv(!synlig(nav), 'Menyen er lukket på mobil');
        skriv(toggle && toggle.getBoundingClientRect().height >= 40, 'Menyknappen er stor nok', toggle && Math.round(toggle.getBoundingClientRect().height) + 'px');

        toggle.click();
        await sov(120);
        skriv(synlig(nav) && nav.classList.contains('is-open'), 'Menyen åpnes');
        skriv(toggle.getAttribute('aria-expanded') === 'true', 'aria-expanded er satt');

        nav.querySelector('a').click();
        await sov(120);
        skriv(!synlig(nav) && !nav.classList.contains('is-open'), 'Menyen lukkes etter klikk');
        skriv(toggle.getAttribute('aria-expanded') === 'false', 'aria-expanded er nullstilt');

        q('input[name="type"][value="Konsulent"]').click();
        q('[data-next]').click();
        await sov(60);
        q('input[name="behov"][value="Teknisk ledelse"]').click();
        q('[data-next]').click();
        await sov(60);
        q('[name="navn"]').value = 'Kari';
        q('[name="epost"]').value = 'kari@firma.no';
        q('[data-next]').click();
        await sov(80);
        skriv(!q('[data-panel="4"]').hidden, 'Sammendraget vises');
        var tilbake = q('[data-back]');
        skriv(tilbake.textContent === 'Endre svarene', 'Tilbake-knappen ber om endring', tilbake.textContent);
        tilbake.click();
        await sov(80);
        skriv(!q('[data-panel="3"]').hidden, 'Tilbake går til kontaktsteget');
        skriv(q('[name="navn"]').value === 'Kari', 'Feltene husker det du skrev');
        q('[data-next]').click();
        await sov(80);
        skriv(q('#sumList').textContent.indexOf('Konsulent') > -1, 'Sammendraget beholder valgene');
      } catch (e) {
        skriv(false, 'Uventet feil', String(e && e.message || e));
      } finally {
        sum.className = feil === 0 ? 'ok' : 'feil';
        sum.textContent = feil === 0 ? 'PASS — ' + antall + ' av ' + antall + ' kontroller er grønne.' : 'FAIL — ' + feil + ' av ' + antall + ' feilet.';
      }
    })();
  });
})();
</script>
</body>
</html>
