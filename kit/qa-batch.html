<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA-batch — demoer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px 26px 50px; background: #0f1115; color: #e8eaee; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  h1 { font: 600 20px/1.3 system-ui, sans-serif; margin: 0 0 6px; }
  p.hint { color: #9aa3b2; margin: 0 0 18px; font: 12.5px/1.5 system-ui, sans-serif; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #232833; white-space: nowrap; }
  th { color: #9aa3b2; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  td.ok { color: #57d38c; }
  td.feil { color: #ff7b72; font-weight: 600; }
  td.detalj { color: #c8ceda; font-size: 12px; white-space: normal; }
  .sum { margin-top: 16px; padding: 12px 16px; border-radius: 10px; font: 600 15px/1.4 system-ui, sans-serif; }
  .sum.ok { background: #10301f; color: #7ee2a8; }
  .sum.feil { background: #331414; color: #ff9b93; }
  iframe { position: absolute; left: -12000px; top: 0; border: 0; }
</style>
</head>
<body>
<h1>QA-batch</h1>
<p class="hint">Måler flere demoer i fem bredder. ?slugs=a,b,c&nbsp;— hver rad er én demo, hver kolonne en bredde.</p>
<table>
  <thead><tr><th>Demo</th><th>360</th><th>390</th><th>768</th><th>1024</th><th>1440</th><th>Detaljer</th></tr></thead>
  <tbody id="rader"></tbody>
</table>
<div id="sum"></div>

<script>
(function () {
  'use strict';
  var BREDDER = [360, 390, 768, 1024, 1440];
  var slugs = (new URLSearchParams(location.search).get('slugs') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var tbody = document.getElementById('rader');
  if (!slugs.length) { document.getElementById('sum').textContent = 'Legg til ?slugs=a,b,c'; return; }

  var ramme = document.createElement('iframe');
  ramme.height = '900';
  document.body.appendChild(ramme);

  function mal(bredde, slug) {
    return new Promise(function (resolve) {
      ramme.style.width = bredde + 'px';
      var ferdig = false;
      function gi(resultat) { if (ferdig) return; ferdig = true; resolve(resultat); }
      ramme.onload = function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            try {
              var d = ramme.contentDocument, w = ramme.contentWindow;
              var stil = d.getElementById('qa-vis');
              if (!stil) {
                stil = d.createElement('style');
                stil.id = 'qa-vis';
                stil.textContent = '.reveal{opacity:1!important;transform:none!important}*,*::before,*::after{animation:none!important;transition:none!important}';
                (d.head || d.documentElement).appendChild(stil);
              }
              var doc = d.documentElement;
              var over = doc.scrollWidth - doc.clientWidth;
              var smaa = 0, utenfor = 0;
              var el = d.body ? d.body.querySelectorAll('*') : [];
              for (var i = 0; i < el.length; i++) {
                var r = el[i].getBoundingClientRect();
                if (r.width === 0 && r.height === 0) continue;
                if (r.right > doc.clientWidth + 2 || r.left < -2) utenfor++;
                if (el[i].matches('a,button,input,select,textarea,[role="button"]') && r.height > 0 && (r.height < 40 || r.width < 40)) smaa++;
              }
              var felt = 0;
              var feltEl = d.querySelectorAll('input,select,textarea');
              for (var j = 0; j < feltEl.length; j++) {
                if ((parseFloat(w.getComputedStyle(feltEl[j]).fontSize) || 0) < 16) felt++;
              }
              var imgs = d.querySelectorAll('img'), alt = 0;
              for (var k = 0; k < imgs.length; k++) { if (!imgs[k].getAttribute('alt')) alt++; }
              var feil = [];
              if (over > 2) feil.push('overflyt ' + over + 'px');
              if (utenfor) feil.push(utenfor + ' utenfor');
              if (smaa) feil.push(smaa + ' små trykkflater');
              if (felt) feil.push(felt + ' felt <16px');
              if (alt) feil.push(alt + ' bilder uten alt');
              gi({ bredde: bredde, feil: feil });
            } catch (e) { gi({ bredde: bredde, feil: ['målefeil'] }); }
          });
        });
      };
      ramme.src = '../' + slug + '/?qa=' + bredde;
      setTimeout(function () { gi({ bredde: bredde, feil: ['tidsavbrudd'] }); }, 9000);
    });
  }

  async function kjor() {
    var feilede = 0;
    for (var s = 0; s < slugs.length; s++) {
      var slug = slugs[s];
      var tr = document.createElement('tr');
      var navn = document.createElement('td');
      navn.textContent = slug;
      tr.appendChild(navn);
      var detaljer = [];
      var radFeil = 0;
      for (var b = 0; b < BREDDER.length; b++) {
        var r = await mal(BREDDER[b], slug);
        var td = document.createElement('td');
        if (r.feil.length) {
          td.className = 'feil'; td.textContent = 'FEIL'; radFeil++;
          detaljer.push(r.bredde + ': ' + r.feil.join(', '));
        } else {
          td.className = 'ok'; td.textContent = 'ok';
        }
        tr.appendChild(td);
      }
      var det = document.createElement('td');
      det.className = 'detalj';
      det.textContent = detaljer.join(' · ') || '—';
      tr.appendChild(det);
      tbody.appendChild(tr);
      if (radFeil) feilede++;
    }
    var sum = document.getElementById('sum');
    sum.className = 'sum ' + (feilede ? 'feil' : 'ok');
    sum.textContent = feilede ? ('FAIL — ' + feilede + ' av ' + slugs.length + ' demoer har avvik.') : ('PASS — alle ' + slugs.length + ' demoer er uten avvik i fem bredder.');
  }
  kjor();
})();
</script>
</body>
</html>
