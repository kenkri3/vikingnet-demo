<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<title>sjekk</title>
</head>
<body>
<iframe id="ramme" src="./index.html" width="1200" height="900" style="border:0"></iframe>
<pre id="ut">venter</pre>
<script>
(function () {
  var ut = [];
  function linje(s) {
    ut.push(s);
    document.getElementById('ut').textContent = ut.join('\n');
    document.title = ut.length + ' linjer; siste: ' + s.slice(0, 60);
  }
  var ramme = document.getElementById('ramme');
  ramme.addEventListener('load', function () {
    setTimeout(kjor, 700);
  });

  function kjor() {
    var d = ramme.contentDocument;
    var w = ramme.contentWindow;
    try {
      w.scrollTo(0, d.body.scrollHeight);
    } catch (e) {
      linje('FEIL scroll: ' + e.message);
    }
    setTimeout(function () {
      try {
        var bilder = Array.prototype.slice.call(d.images).map(function (i) {
          return i.getAttribute('src') + ' complete=' + i.complete + ' ' + i.naturalWidth + 'x' + i.naturalHeight;
        });
        linje('BILDER: ' + bilder.join(' | '));

        var nav = d.getElementById('nav');
        linje('MENY desktop: hidden=' + nav.hidden);

        var rolle = d.querySelector('[data-rolle="oppdragsgiver"]');
        rolle.click();
        linje('ROLLE trykket: aria-pressed=' + rolle.getAttribute('aria-pressed'));

        var omrade = d.getElementById('bp-omrade');
        omrade.value = 'Lager';
        linje('OMRADE: ' + omrade.value);

        var steg = function (n) { return d.querySelector('[data-steg="' + n + '"]'); };
        steg(1).querySelector('[data-neste]').click();
        linje('STEG1->2: steg1.hidden=' + steg(1).hidden + ' steg2.hidden=' + steg(2).hidden);

        steg(2).querySelector('[data-neste]').click();
        linje('TOM KONTAKT: feil2 synlig=' + !d.querySelector('[data-feil="2"]').hidden);

        d.getElementById('bp-navn').value = 'Test Testesen';
        d.getElementById('bp-tel').value = '912 34 567';
        d.getElementById('bp-epost').value = 'test@testesen.no';
        d.getElementById('bp-melding').value = 'Trenger to folk på lager fra mandag.';

        steg(2).querySelector('[data-neste]').click();
        var sammendrag = d.getElementById('bp-sammendrag');
        linje('STEG2->3: steg3.hidden=' + steg(3).hidden + ' sammendrag_dd=' + sammendrag.querySelectorAll('dd').length);
        linje('SAMMENDRAG: ' + sammendrag.textContent.replace(/\s+/g, ' ').trim());

        var send = d.getElementById('bp-send');
        linje('MAILTO: ' + (send.getAttribute('href') || '').slice(0, 120));

        steg(3).querySelector('[data-forrige]').click();
        linje('TILBAKE: steg2.hidden=' + steg(2).hidden);
        steg(2).querySelector('[data-neste]').click();

        send.click();
        var kvit = d.getElementById('bp-kvittering');
        linje('KVITTERING: skjult=' + kvit.hidden + ' rader=' + kvit.querySelectorAll('dd').length);
        linje('KVITTERINGSTEKST: ' + kvit.textContent.replace(/\s+/g, ' ').trim().slice(0, 200));

        d.getElementById('bp-nullstill').click();
        linje('NULLSTILL: steg1 visible=' + !steg(1).hidden + ' kvit skjult=' + d.getElementById('bp-kvittering').hidden + ' navn=' + JSON.stringify(d.getElementById('bp-navn').value));

        linje('FERDIG');
      } catch (e) {
        linje('FEIL: ' + e.message + ' @ ' + e.stack.split('\n')[1]);
      }
    }, 1200);
  }
})();
</script>
</body>
</html>
