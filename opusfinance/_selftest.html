<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Selvtest</title>
<style>
  body { margin: 0; background: #fff; color: #111; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  #out { margin: 0; padding: 10px 12px; white-space: pre-wrap; background: #101014; color: #d8f5e3; }
  iframe { display: block; width: 1200px; height: 7200px; border: 0; }
</style>
</head>
<body>
<pre id="out">kjører …</pre>
<iframe id="f" src="/opusfinance/" title="demo"></iframe>
<script>
var log = [];
function ok(navn, verdi, ekstra) {
  log.push((verdi ? 'PASS' : 'FAIL') + '  ' + navn + (ekstra !== undefined && ekstra !== '' ? '  [' + ekstra + ']' : ''));
}
var f = document.getElementById('f');
f.addEventListener('load', function () {
  var d = f.contentDocument, w = f.contentWindow;
  setTimeout(function () {
    try {
      var img = d.querySelector('.radgivere__figur img');
      ok('bilde lastet', !!(img && img.naturalWidth > 0), img ? img.naturalWidth + 'x' + img.naturalHeight : 'mangler');
      var st = w.getComputedStyle(d.querySelector('.hero h1'));
      ok('display-font', /Instrument Serif/.test(st.fontFamily), st.fontFamily.slice(0, 30));
      ok('ett lesbart skript', d.querySelectorAll('script[src="app.js"]').length === 1);

      var form = d.getElementById('samtale');
      var pan = function (n) { return form.querySelector('.wiz__panel[data-step="' + n + '"]'); };
      var btn = function (p, a) { return p.querySelector('[' + a + ']'); };
      var vis = function () { return [1,2,3,4,5].filter(function (n) { return !pan(n).hidden; }).join(','); };

      ok('steg 1 synlig', vis() === '1', vis());

      btn(pan(1), 'data-neste').click();
      var f1 = pan(1).querySelector('[data-feil="behov"]').textContent;
      ok('validering: behov', f1.length > 0, f1);

      form.querySelector('input[name="behov"][value="Interim"]').checked = true;
      btn(pan(1), 'data-neste').click();
      ok('til steg 2', vis() === '2', vis());

      btn(pan(2), 'data-neste').click();
      ok('validering: rolle', pan(2).querySelector('[data-feil="rolle"]').textContent.length > 0);

      d.getElementById('rolle').value = 'CFO / Økonomidirektør';
      d.getElementById('tidsramme').value = 'Så snart som mulig';
      btn(pan(2), 'data-neste').click();
      ok('til steg 3', vis() === '3', vis());

      d.getElementById('navn').value = 'Kari Nordmann';
      d.getElementById('firma').value = 'Nordmann AS';
      d.getElementById('epost').value = 'feil-epost';
      d.getElementById('telefon').value = '123';
      btn(pan(3), 'data-neste').click();
      var f3 = pan(3).querySelector('[data-feil="kontakt"]').textContent;
      ok('validering: kontakt', f3.length > 0, f3);

      d.getElementById('melding').value = 'Vi trenger en controller fra neste kvartal.';
      d.getElementById('epost').value = 'kari@nordmann.no';
      d.getElementById('telefon').value = '912 34 567';
      btn(pan(3), 'data-neste').click();
      var sumBehov = form.querySelector('[data-sum="behov"]').textContent;
      ok('oppsummering', vis() === '4' && sumBehov === 'Interim', vis() + ' / ' + sumBehov);

      btn(pan(4), 'data-lag-kvittering').click();
      var ref = form.querySelector('[data-referanse]').textContent;
      ok('kvittering + referanse', vis() === '5' && /^OFR-\d{8}-\d{3}$/.test(ref), ref);

      var href = form.querySelector('[data-send-epost]').getAttribute('href');
      ok('mailto-lenke', href.indexOf('mailto:kontakt@opusfinance.no?subject=') === 0 && href.indexOf('Kari') > -1, href.slice(0, 70) + '…');

      var k = form.querySelector('[data-kvittering-kontakt]').textContent;
      ok('kvittering: kontakt', k.indexOf('kari@nordmann.no') > -1, k);

      btn(pan(5), 'data-start-pa-nytt').click();
      ok('start på nytt', vis() === '1' && !form.querySelector('input[name="behov"]:checked'));

      d.querySelector('[data-preselect="Rekruttering"]').click();
      ok('snarvei fra hero', vis() === '2' && form.querySelector('input[name="behov"][value="Rekruttering"]').checked, vis());

      var feil = 0;
      log.forEach(function (l) { if (l.indexOf('FAIL') === 0) feil++; });
      log.push('');
      log.push(feil === 0 ? 'ALLE ' + log.length + ' SJEKKER PASS' : feil + ' FEIL');
    } catch (e) {
      log.push('FAIL  unntak: ' + e.message);
    }
    document.getElementById('out').textContent = log.join('\n');
  }, 1200);
});
</script>
</body>
</html>
