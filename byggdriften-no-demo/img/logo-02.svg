<svg viewBox="0 0 560 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footerMapTitle" aria-describedby="footerMapDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="footerMapTitle">Fra Oslo til Halden langs østsiden av Oslofjorden</title>
<desc id="footerMapDesc">Forenklet områdekart fra Oslo gjennom Akershus og Østfold, helt til Halden i sørøst. Østsiden av fjorden og området vest for Oslo mot Asker er markert i korall. Drøbak, Vestby, Moss, Fredrikstad og Halden er vist som orienteringspunkter. Kartet viser ikke nøyaktige kommunegrenser.</desc>
